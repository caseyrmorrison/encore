version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # let fresh releases age a week before we take them (supply-chain cooldown)
    cooldown:
      default-days: 7
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
